name: CI

# Runs typecheck, lint, and the Vitest RLS/logic probes against a fresh local
# Supabase (schema + seed built from zero). This makes the security-floor probes
# (c1–c4, h1, h2, rls-writes, claim-flow, validation) permanent regression guards:
# a Gate-1-class regression can no longer merge silently.

on:
  push:
    branches: [rebuild, main]
  pull_request:
    branches: [rebuild, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22+ is required — supabase-js v2.110+ resolves
          # WebSocket via `globalThis.WebSocket`, which lands on
          # Node 22 (undici's native ws). Node 20 throws
          # "Node.js detected but native WebSocket not found" the
          # moment a client is constructed.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned — newer CLI versions ship a Postgres image whose
          # auth roles are no longer granted table privileges by
          # default, which regressed service_role writes in probes.
          # 2.98.2 matches the local dev CLI the probes were built
          # against.
          version: 2.98.2

      - name: Start Supabase (boots local stack via Docker)
        run: supabase start

      - name: Reset DB from zero (applies migrations + seed.sql)
        run: supabase db reset

      - name: Export local Supabase env for the tests
        # tests/harness.ts reads TEST_SUPABASE_URL / TEST_SUPABASE_ANON_KEY /
        # TEST_SUPABASE_SERVICE_ROLE_KEY. The build step (next build) also
        # wants the NEXT_PUBLIC_SUPABASE_URL / _ANON_KEY pair, so we
        # export both under the same values.
        run: |
          set -euo pipefail
          STATUS=$(supabase status -o env)
          # Every key/value in `-o env` is quoted; strip the quotes.
          API_URL=$(printf '%s\n' "$STATUS" | awk -F= '/^API_URL=/{gsub(/"/,"",$2); print $2}')
          ANON_KEY=$(printf '%s\n' "$STATUS" | awk -F= '/^ANON_KEY=/{gsub(/"/,"",$2); print $2}')
          SERVICE_ROLE_KEY=$(printf '%s\n' "$STATUS" | awk -F= '/^SERVICE_ROLE_KEY=/{gsub(/"/,"",$2); print $2}')
          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "Failed to parse supabase status output:"
            printf '%s\n' "$STATUS"
            exit 1
          fi
          echo "API_URL=$API_URL"
          echo "ANON_KEY starts with $(printf '%s' "$ANON_KEY" | cut -c1-20)…"
          echo "SERVICE_ROLE_KEY starts with $(printf '%s' "$SERVICE_ROLE_KEY" | cut -c1-20)…"
          {
            echo "TEST_SUPABASE_URL=$API_URL"
            echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Run tests (RLS / logic / flow probes)
        run: npm test

      # Optional build gate — remove if it's flaky against prerender.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
