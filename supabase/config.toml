# ─────────────────────────────────────────────────────────────────────
# LOCAL DEV CONFIG ONLY.  DO NOT USE IN PRODUCTION.
#
# This file configures a *local* Supabase stack started with
# `supabase start`. In production, Auth settings come from the Supabase
# Cloud dashboard (Authentication → URL Configuration / Providers),
# NOT from this file.
#
# In particular: `enable_confirmations = false` below is set for fast
# local testing (signup lands you straight into onboarding without an
# email round-trip). If this file is ever pushed to a linked prod
# project it will disable email confirmation there, which combined with
# `enable_signup = true` allows unverified signups. Never `supabase
# db push` or `supabase link` this file at a production project.
#
# CLAUDE.md documents the production settings we require.
# ─────────────────────────────────────────────────────────────────────

project_id = "tournament-guru"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local email testing inbox — reset/confirmation emails land here, no real SMTP.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# OFF for fast local testing — signup logs you straight into onboarding.
enable_confirmations = false
